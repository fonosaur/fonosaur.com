<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FONOSAUR - Pockets - EP</title>
    <!-- POCKETS_EP_UNLISTED: delete on release day (see next.config.mjs) -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="FS86 EP player: the FONOSAUR EP, performed on the FS86." />
    <!--
      FS86 EP PLAYER (Stage 1)
      A locked, spectator copy of the FS86 device that plays the EP defined in
      /pockets-ep/ep.config.json. Styling is copied (not shared) from /create.html so the
      sampler is never touched. Only the transport is interactive.

      Stage 2 hook: window.FS86EP.engine exposes the single <audio> element, the
      single AudioContext, its MediaElementSource and an output GainNode.
      Attach an AnalyserNode with:  engine.output.connect(analyser)
      Pads are already rendered with .glow layers (toggle .hit, or drive
      --pad-level) via window.FS86EP.pads.
    -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Unbounded:wght@200;400;700&display=swap");

      /* ---------- tokens (copied from create.html :root) ---------- */
      :root {
        --bg: #0a0a0c;
        --panel: #141418;
        --panel-2: #101014;
        --line: #26262b;
        --text: #e8e8ea;
        --sub: #9c9ca4;
        --green: #00cc50;
        --lcd-bg: #04150e;
        --lcd-bg-2: #020906;
        --lcd-ink: #b6ffd5;
        --lcd-ink-soft: rgba(125, 255, 184, 0.58);
        --lcd-font: "Space Mono", monospace;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.025), transparent 32%),
          var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      button {
        font: inherit;
        cursor: pointer;
        color: var(--text);
      }

      button:focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 2px;
      }

      /* ---------- container: every layout rule below keys off THIS width ---------- */
      .stage {
        container-type: inline-size;
        container-name: stage;
        width: 100%;
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 10px 18px;
      }

      /* ---------- device chassis (create.html .device / .skin / .skinveil) ---------- */
      .device {
        position: relative;
        width: min(100%, 520px);
        aspect-ratio: 0.73;
        flex-shrink: 0;
        border-radius: 28px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background:
          linear-gradient(180deg, rgba(29, 29, 35, 0.96), rgba(14, 14, 18, 0.98)),
          var(--panel);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.05),
          0 22px 48px rgba(0, 0, 0, 0.46);
      }

      .skin {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        opacity: 0;
        transition: opacity 0.6s ease;
      }

      .skinveil {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Print skin treatment from create.html, dimmed further for the cover so
         the LCD and labels stay legible over arbitrary artwork. */
      .device.has-print-skin .skin {
        opacity: 0.58;
        filter: saturate(0.95) brightness(0.72) contrast(1);
      }

      .device.has-print-skin .skinveil {
        background:
          linear-gradient(180deg, rgba(9, 9, 11, 0.42), rgba(9, 9, 11, 0.62)),
          radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.05), transparent 38%),
          linear-gradient(90deg, rgba(0, 0, 0, 0.1), transparent 28%, transparent 72%, rgba(0, 0, 0, 0.12));
      }

      .device-ui {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding: 9px;
        height: 100%;
      }

      /* ---------- locked controls: present, inert, no handlers ---------- */
      .is-locked {
        pointer-events: none;
      }

      .is-locked .mode-btn,
      .is-locked .bottom-btn {
        opacity: 0.5;
        cursor: default;
      }

      .mode-switch {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 5px;
        flex-shrink: 0;
      }

      .mode-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 30px;
        border-radius: 11px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(10, 10, 12, 0.82)),
          rgba(13, 13, 16, 0.84);
        color: rgba(232, 232, 234, 0.58);
        font-family: "Space Mono", monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .mode-btn.is-active {
        border-color: rgba(125, 255, 184, 0.35);
        background:
          radial-gradient(circle at 50% 0, rgba(91, 255, 154, 0.16), transparent 70%),
          linear-gradient(180deg, rgba(19, 54, 34, 0.82), rgba(10, 18, 13, 0.92));
        color: var(--lcd-ink);
      }

      /* ---------- LCD (create.html .lcd) ---------- */
      .lcd {
        position: relative;
        flex-shrink: 0;
        padding: 7px 9px 8px;
        border-radius: 13px;
        border: 1px solid rgba(48, 112, 82, 0.45);
        background:
          repeating-linear-gradient(180deg, rgba(0, 0, 0, 0.22) 0, rgba(0, 0, 0, 0.22) 1px, transparent 1px, transparent 3px),
          radial-gradient(circle at 50% 12%, rgba(125, 255, 184, 0.08), transparent 60%),
          linear-gradient(180deg, var(--lcd-bg), var(--lcd-bg-2));
        box-shadow:
          inset 0 0 20px rgba(0, 255, 120, 0.06),
          inset 0 1px 0 rgba(162, 255, 213, 0.07),
          0 0 0 1px rgba(5, 18, 12, 0.55);
        color: var(--lcd-ink);
        font-family: var(--lcd-font);
        text-shadow: 0 0 9px rgba(0, 255, 120, 0.16);
      }

      .lcd::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background:
          linear-gradient(180deg, rgba(180, 255, 217, 0.06), transparent 34%),
          repeating-linear-gradient(180deg, transparent 0, transparent 2px, rgba(0, 0, 0, 0.12) 2px, rgba(0, 0, 0, 0.12) 3px);
        pointer-events: none;
      }

      .lcd-row {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-width: 0;
      }

      .lcd-row + .lcd-row {
        margin-top: 5px;
      }

      .lcd-status {
        font-size: 17px;
        line-height: 1;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .lcd-badge {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        min-height: 18px;
        padding: 0 7px;
        border-radius: 999px;
        border: 1px solid rgba(125, 255, 184, 0.28);
        background: rgba(5, 18, 12, 0.72);
        color: var(--lcd-ink);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .lcd-ep {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        line-height: 1.1;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--lcd-ink-soft);
      }

      .lcd-bpm {
        flex-shrink: 0;
        font-size: 13px;
        line-height: 1;
        letter-spacing: 0.08em;
        color: var(--lcd-ink-soft);
        white-space: nowrap;
      }

      .lcd-number {
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.06em;
        color: var(--lcd-ink);
      }

      .lcd-track {
        min-width: 0;
        display: flex;
        align-items: baseline;
        gap: 9px;
        font-size: 19px;
        line-height: 1.15;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .lcd-track-no {
        flex-shrink: 0;
        opacity: 0.6;
      }

      .lcd-track-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .lcd-time {
        flex-shrink: 0;
        font-size: 13px;
        line-height: 1;
        white-space: nowrap;
        color: var(--lcd-ink-soft);
      }

      /* Progress bar: continuous fill under a segment mask so it reads like
         the FS86 step row but moves smoothly. */
      .lcd-progress {
        position: relative;
        z-index: 1;
        height: 8px;
        margin-top: 7px;
        border-radius: 2px;
        border: 1px solid rgba(125, 255, 184, 0.1);
        background: rgba(14, 76, 44, 0.2);
        overflow: hidden;
      }

      .lcd-progress-fill {
        position: absolute;
        inset: 0;
        transform-origin: left center;
        transform: scaleX(0);
        background: rgba(125, 255, 184, 0.88);
        box-shadow: 0 0 12px rgba(0, 255, 120, 0.25);
      }

      .lcd-progress::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / 32 - 2px), var(--lcd-bg-2) calc(100% / 32 - 2px), var(--lcd-bg-2) calc(100% / 32));
        pointer-events: none;
      }

      /* ---------- transport (create.html .transport-btn) ---------- */
      .transport {
        flex-shrink: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr);
        gap: 5px;
      }

      .transport-btn,
      .bottom-btn {
        min-width: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 9px 6px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(17, 17, 20, 0.96)),
          var(--panel-2);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        line-height: 1;
        font-family: "Space Mono", monospace;
        transition:
          transform 0.15s ease,
          border-color 0.15s ease,
          background 0.15s ease,
          color 0.15s ease;
      }

      .transport-btn {
        min-height: 40px;
        touch-action: manipulation;
      }

      .transport-btn:active {
        transform: translateY(1px);
      }

      .transport-btn:disabled {
        opacity: 0.42;
        cursor: default;
      }

      .transport-btn.is-playing {
        border-color: rgba(122, 182, 87, 0.42);
        color: #f3fff3;
        background:
          linear-gradient(180deg, rgba(122, 182, 87, 0.2), rgba(17, 17, 20, 0.96)),
          var(--panel-2);
      }

      .transport-icon {
        flex-shrink: 0;
        font-size: 12px;
      }

      /* ---------- pads (create.html .pad-zone / .grid / .pad) ---------- */
      .pad-zone {
        flex: 1;
        min-height: 0;
        padding: 5px;
        position: relative;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.04);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.015), rgba(0, 0, 0, 0.08)),
          rgba(9, 9, 11, 0.3);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: repeat(4, minmax(0, 1fr));
        gap: 6px;
        width: 100%;
        height: 100%;
      }

      .pad {
        position: relative;
        min-width: 0;
        min-height: 0;
        border-radius: 12px;
        background: linear-gradient(160deg, #2a2a31, #131317);
        border: 1px solid rgba(255, 255, 255, 0.07);
        box-shadow:
          0 3px 0 rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.07);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        cursor: default;
      }

      .pad .dot {
        position: absolute;
        top: 8px;
        left: 9px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }

      .pad .key {
        position: absolute;
        top: 6px;
        right: 8px;
        font-family: "Space Mono", monospace;
        font-size: 9px;
        color: rgba(255, 255, 255, 0.62);
      }

      .pad .lab {
        padding: 7px 9px;
        font-size: 10px;
        font-weight: 700;
        font-family: "Space Mono", monospace;
        letter-spacing: 0.03em;
        color: var(--sub);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Stage 2 drives either .hit or --pad-level (0..1) on each pad. */
      .pad .glow {
        position: absolute;
        inset: -1px;
        border-radius: 12px;
        opacity: calc(var(--pad-level, 0) * 0.85);
        pointer-events: none;
        transition: opacity 0.32s ease-out;
      }

      .pad.hit .glow {
        opacity: 0.85;
        transition: opacity 0s;
      }

      .bottom-row {
        flex-shrink: 0;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        margin-top: 1px;
      }

      .bottom-btn {
        padding: 8px 6px;
      }

      /* ---------- responsive: container queries (mirror create.html's 560 / 420 breakpoints) ---------- */
      @container stage (max-width: 560px) {
        .device {
          width: 100%;
          border-radius: 24px;
        }

        .device-ui {
          gap: 6px;
          padding: 7px;
        }

        .lcd {
          padding: 6px 7px 7px;
          border-radius: 12px;
        }

        .lcd-track {
          font-size: 17px;
        }

        .transport {
          gap: 4px;
        }

        .bottom-btn {
          gap: 4px;
          padding: 8px 4px;
          font-size: 8.5px;
        }

        .transport-btn {
          font-size: 10px;
        }
      }

      @container stage (max-width: 420px) {
        .device-ui {
          gap: 5px;
          padding: 6px;
        }

        .mode-btn {
          min-height: 26px;
          font-size: 9px;
        }

        .lcd-status {
          font-size: 14px;
        }

        .lcd-track {
          font-size: 15px;
          gap: 7px;
        }

        .lcd-ep,
        .lcd-bpm,
        .lcd-time {
          font-size: 11px;
        }

        .transport {
          gap: 3px;
        }

        .transport-btn {
          min-height: 38px;
          gap: 4px;
          padding: 7px 3px;
          font-size: 9px;
        }

        .bottom-btn {
          gap: 3px;
          padding: 7px 3px;
          font-size: 8px;
        }

        .pad-zone {
          padding: 4px;
          border-radius: 16px;
        }

        .grid {
          gap: 4px;
        }

        .pad .dot {
          width: 4px;
          height: 4px;
          top: 5px;
          left: 5px;
        }

        .pad .key {
          top: 4px;
          right: 5px;
          font-size: 6px;
        }

        .pad .lab {
          padding: 4px 4px 5px;
          font-size: 6px;
        }
      }

      @container stage (max-width: 320px) {
        .stage {
          padding: 6px 4px 12px;
        }

        .lcd-status {
          font-size: 12px;
        }

        .lcd-track {
          font-size: 13px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .skin,
        .pad .glow,
        .transport-btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="device" id="device">
        <div class="skin" id="skin"></div>
        <div class="skinveil"></div>

        <div class="device-ui">
          <div class="mode-switch is-locked" inert aria-hidden="true">
            <div class="mode-btn is-active">PADS</div>
            <div class="mode-btn">SEQ</div>
            <div class="mode-btn">FX</div>
          </div>

          <section class="lcd" aria-label="Now playing">
            <div class="lcd-row">
              <div class="lcd-status" id="lcdStatus" aria-live="polite">LOADING</div>
              <span class="lcd-badge" id="lcdCount">TRACK -/-</span>
            </div>
            <div class="lcd-row">
              <div class="lcd-ep" id="lcdEp">&nbsp;</div>
              <div class="lcd-bpm"><span class="lcd-number" id="lcdBpm">---</span> BPM</div>
            </div>
            <div class="lcd-row">
              <div class="lcd-track">
                <span class="lcd-track-no lcd-number" id="lcdTrackNo">--</span>
                <span class="lcd-track-title" id="lcdTrackTitle">&nbsp;</span>
              </div>
              <div class="lcd-time">
                <span class="lcd-number" id="lcdElapsed">0:00</span> /
                <span class="lcd-number" id="lcdTotal">0:00</span>
              </div>
            </div>
            <div
              class="lcd-progress"
              id="lcdProgress"
              role="progressbar"
              aria-label="Track progress"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div class="lcd-progress-fill" id="lcdProgressFill"></div>
            </div>
          </section>

          <div class="transport" role="group" aria-label="Transport">
            <button class="transport-btn" id="prevBtn" type="button" aria-label="Previous track" title="Previous" disabled>
              <span class="transport-icon" aria-hidden="true">&#9198;&#xFE0E;</span>
              <span>PREV</span>
            </button>
            <button class="transport-btn" id="playBtn" type="button" aria-label="Play" title="Play" disabled>
              <span class="transport-icon" id="playIcon" aria-hidden="true">&#9654;&#xFE0E;</span>
              <span id="playLabel">PLAY</span>
            </button>
            <button class="transport-btn" id="nextBtn" type="button" aria-label="Next track" title="Next" disabled>
              <span>NEXT</span>
              <span class="transport-icon" aria-hidden="true">&#9197;&#xFE0E;</span>
            </button>
          </div>

          <div class="pad-zone is-locked" inert aria-hidden="true">
            <div class="grid" id="grid"></div>
          </div>

          <div class="bottom-row is-locked" inert aria-hidden="true">
            <div class="bottom-btn"><span class="transport-icon">&#8599;</span><span>SHARE</span></div>
            <div class="bottom-btn">SHUFFLE</div>
            <div class="bottom-btn">SKIN</div>
          </div>
        </div>
      </div>
    </main>

    <script>
      (() => {
        "use strict";

        const CONFIG_URL = "/pockets-ep/ep.config.json";
        const RESTART_THRESHOLD_S = 3;

        // ---------- decorative pads (default FS86 kit layout, no handlers) ----------
        const CAT_COLOR = {
          kick: "#a06820",
          snare: "#8b5cf6",
          hat: "#3b8bff",
          clap: "#ff6b5c",
          perc: "#00cc50",
        };
        const PADS = [
          ["kick", "1", "KICK"], ["snare", "2", "SNARE"], ["hat", "3", "HAT CL"], ["hat", "4", "HAT OP"],
          ["kick", "Q", "KICK 2"], ["snare", "W", "SNARE 2"], ["clap", "E", "CLAP"], ["hat", "R", "HAT 2"],
          ["perc", "A", "SHAKER"], ["perc", "S", "TAMB"], ["perc", "D", "COWBELL"], ["perc", "F", "CLAVE"],
          ["perc", "Z", "TRIANGLE"], ["perc", "X", "BLOCK"], ["clap", "C", "SNAP"], ["perc", "V", "PERC"],
        ];

        const $ = (id) => document.getElementById(id);
        const grid = $("grid");
        const padEls = PADS.map(([cat, key, label], i) => {
          const col = CAT_COLOR[cat];
          const d = document.createElement("div");
          d.className = "pad";
          d.dataset.pad = String(i);
          d.dataset.cat = cat;
          d.innerHTML =
            '<span class="dot" style="background:' + col + '"></span>' +
            '<span class="key">' + key + "</span>" +
            '<div class="glow" style="box-shadow:inset 0 0 22px ' + col + ", 0 0 16px " + col + "; border:1px solid " + col + '"></div>' +
            '<div class="lab">' + label + "</div>";
          grid.appendChild(d);
          return d;
        });

        // ---------- audio engine: ONE element, ONE context ----------
        // The element streams (no up-front decode). On the first user tap the
        // element is routed through a single AudioContext so Stage 2 can tap
        // `output` with an AnalyserNode without touching playback code.
        const engine = (() => {
          const audio = new Audio();
          audio.preload = "auto";
          audio.crossOrigin = "anonymous"; // analyser needs CORS-clean audio if masters move to a CDN
          audio.setAttribute("playsinline", "");
          audio.setAttribute("webkit-playsinline", "");
          audio.setAttribute("controlsList", "nodownload noplaybackrate");
          audio.disableRemotePlayback = true;

          let context = null;
          let source = null;
          let output = null;

          // Must be called synchronously inside a user gesture (iOS unlock).
          function unlock() {
            try {
              // Safari 17+: play through the silent switch like a music app.
              if (navigator.audioSession) navigator.audioSession.type = "playback";
            } catch (_) {}
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!context && AC) {
              try {
                context = new AC();
                source = context.createMediaElementSource(audio);
                output = context.createGain();
                source.connect(output);
                output.connect(context.destination);
              } catch (err) {
                // Fall back to plain element output; Stage 2 just won't get an analyser.
                console.warn("[FS86EP] Web Audio routing unavailable", err);
                context = null;
              }
            }
            if (context && context.state !== "running") {
              context.resume().catch(() => {});
            }
          }

          return {
            audio,
            unlock,
            get context() { return context; },
            get source() { return source; },
            get output() { return output; },
          };
        })();

        const audio = engine.audio;

        // ---------- state ----------
        let ep = null;
        let index = 0;
        let warmed = new Set();
        let ended = false;
        let pendingPlay = false; // play() requested, "playing" not yet fired

        const ui = {
          device: $("device"),
          skin: $("skin"),
          status: $("lcdStatus"),
          count: $("lcdCount"),
          ep: $("lcdEp"),
          bpm: $("lcdBpm"),
          trackNo: $("lcdTrackNo"),
          trackTitle: $("lcdTrackTitle"),
          elapsed: $("lcdElapsed"),
          total: $("lcdTotal"),
          progress: $("lcdProgress"),
          fill: $("lcdProgressFill"),
          prev: $("prevBtn"),
          play: $("playBtn"),
          playIcon: $("playIcon"),
          playLabel: $("playLabel"),
          next: $("nextBtn"),
        };

        const pad2 = (n) => String(n).padStart(2, "0");
        function fmt(s) {
          if (!Number.isFinite(s) || s < 0) s = 0;
          s = Math.floor(s);
          return Math.floor(s / 60) + ":" + pad2(s % 60);
        }

        const track = () => ep.tracks[index];
        function duration() {
          const d = audio.duration;
          return Number.isFinite(d) && d > 0 ? d : track().duration || 0;
        }
        const isPlaying = () => !audio.paused && !audio.ended;

        function setStatus(text) {
          if (ui.status.textContent !== text) ui.status.textContent = text;
        }

        function renderTrack() {
          const t = track();
          ui.count.textContent = "TRACK " + (index + 1) + "/" + ep.tracks.length;
          ui.bpm.textContent = String(t.bpm);
          ui.trackNo.textContent = pad2(index + 1);
          ui.trackTitle.textContent = t.title;
          ui.trackTitle.title = t.title;
          renderTime();
        }

        function renderTime() {
          const d = duration();
          const c = Math.min(audio.currentTime || 0, d || Infinity);
          ui.elapsed.textContent = fmt(c);
          ui.total.textContent = fmt(d);
          const p = d > 0 ? Math.max(0, Math.min(1, c / d)) : 0;
          ui.fill.style.transform = "scaleX(" + p.toFixed(4) + ")";
          ui.progress.setAttribute("aria-valuenow", String(Math.round(p * 100)));
        }

        function renderTransport() {
          const playing = isPlaying();
          ui.play.classList.toggle("is-playing", playing);
          ui.playIcon.innerHTML = playing ? "&#10074;&#10074;" : "&#9654;&#xFE0E;";
          ui.playLabel.textContent = playing ? "PAUSE" : "PLAY";
          ui.play.setAttribute("aria-label", playing ? "Pause" : "Play");
          ui.play.title = playing ? "Pause" : "Play";
          if ("mediaSession" in navigator) {
            navigator.mediaSession.playbackState = playing ? "playing" : "paused";
          }
        }

        // ---------- smooth progress while playing ----------
        let raf = 0;
        function tick() {
          renderTime();
          raf = isPlaying() ? requestAnimationFrame(tick) : 0;
        }
        function startTicker() {
          if (!raf) raf = requestAnimationFrame(tick);
        }

        // ---------- loading / preloading ----------
        // Only the current track is attached to the element. For the next
        // track we fetch just the first 64KB (MP3 header + opening frames) to
        // warm the connection/cache; its title/BPM/duration come from config.
        function warmNext() {
          const next = ep.tracks[index + 1];
          if (!next || warmed.has(next.src)) return;
          warmed.add(next.src);
          fetch(next.src, { headers: { Range: "bytes=0-65535" } }).catch(() => {});
        }

        function load(i, autoplay) {
          index = (i + ep.tracks.length) % ep.tracks.length;
          ended = false;
          audio.src = track().src;
          audio.load();
          renderTrack();
          updateMediaSession();
          warmNext();
          if (autoplay) play();
          else setStatus("READY");
          renderTransport();
        }

        function play() {
          engine.unlock();
          ended = false;
          pendingPlay = true;
          setStatus("LOADING");
          const p = audio.play();
          if (p && p.catch) {
            p.catch((err) => {
              if (err && err.name === "AbortError") return; // superseded by a newer load()
              pendingPlay = false;
              console.warn("[FS86EP] play() rejected", err);
              setStatus("TAP PLAY");
              renderTransport();
            });
          }
        }

        // ---------- transport ----------
        function togglePlay() {
          if (!ep) return;
          if (isPlaying()) {
            pendingPlay = false;
            audio.pause();
          } else play();
        }

        function prev() {
          if (!ep) return;
          const wasPlaying = isPlaying();
          if (audio.currentTime > RESTART_THRESHOLD_S || index === 0) {
            audio.currentTime = 0;
            renderTime();
            if (wasPlaying) play();
            return;
          }
          load(index - 1, wasPlaying);
        }

        function next() {
          if (!ep) return;
          load(index + 1, isPlaying());
        }

        ui.play.addEventListener("click", togglePlay);
        ui.prev.addEventListener("click", prev);
        ui.next.addEventListener("click", next);

        document.addEventListener("keydown", (e) => {
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          if (e.code === "Space" && e.target === document.body) {
            e.preventDefault();
            togglePlay();
          } else if (e.code === "ArrowRight") {
            next();
          } else if (e.code === "ArrowLeft") {
            prev();
          }
        });

        // ---------- element events ----------
        audio.addEventListener("loadedmetadata", renderTime);
        audio.addEventListener("durationchange", renderTime);
        audio.addEventListener("timeupdate", () => { if (!raf) renderTime(); });
        audio.addEventListener("waiting", () => setStatus("LOADING"));
        audio.addEventListener("playing", () => {
          pendingPlay = false;
          setStatus("PLAYING");
          renderTransport();
          startTicker();
        });
        audio.addEventListener("pause", () => {
          // Ignore the pause fired by swapping src mid-play.
          if (!pendingPlay && !ended && !audio.ended) setStatus("PAUSED");
          renderTransport();
          renderTime();
        });
        audio.addEventListener("ended", () => {
          if (index < ep.tracks.length - 1) {
            load(index + 1, true); // same element, already unlocked: allowed on iOS
          } else {
            load(0, false);
            ended = true;
            setStatus("END OF EP");
            renderTransport();
          }
        });
        audio.addEventListener("error", () => {
          if (!audio.getAttribute("src")) return;
          setStatus("AUDIO ERROR");
          renderTransport();
        });

        // iOS can suspend/interrupt the context (calls, backgrounding). Try
        // to recover when the page becomes visible again.
        document.addEventListener("visibilitychange", () => {
          const ctx = engine.context;
          if (document.visibilityState === "visible" && ctx && ctx.state !== "running" && isPlaying()) {
            ctx.resume().catch(() => {});
          }
        });

        // ---------- no save affordances ----------
        document.addEventListener("contextmenu", (e) => e.preventDefault());
        document.addEventListener("dragstart", (e) => e.preventDefault());

        // ---------- lock screen / hardware keys ----------
        function updateMediaSession() {
          if (!("mediaSession" in navigator) || !window.MediaMetadata) return;
          navigator.mediaSession.metadata = new MediaMetadata({
            title: track().title,
            artist: ep.artist,
            album: ep.title,
            artwork: ep.cover ? [{ src: ep.cover }] : [],
          });
        }
        if ("mediaSession" in navigator) {
          const ms = navigator.mediaSession;
          const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch (_) {} };
          set("play", () => play());
          set("pause", () => { pendingPlay = false; audio.pause(); });
          set("previoustrack", prev);
          set("nexttrack", next);
        }

        // ---------- boot ----------
        function applyCover(src) {
          if (!src) return;
          const img = new Image();
          img.onload = () => {
            ui.skin.style.backgroundImage = 'url("' + src + '")';
            ui.device.classList.add("has-print-skin");
            ui.skin.style.opacity = "";
          };
          img.src = src;
        }

        fetch(CONFIG_URL, { cache: "no-cache" })
          .then((r) => {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then((cfg) => {
            if (!cfg || !Array.isArray(cfg.tracks) || !cfg.tracks.length) {
              throw new Error("config has no tracks");
            }
            ep = cfg;
            document.title = cfg.artist + " - " + cfg.title;
            ui.ep.textContent = cfg.title + " · " + cfg.artist;
            applyCover(cfg.cover);
            load(0, false);
            setStatus("TAP PLAY");
            [ui.prev, ui.play, ui.next].forEach((b) => (b.disabled = false));
          })
          .catch((err) => {
            console.error("[FS86EP] config load failed", err);
            setStatus("NO SIGNAL");
          });

        // Stage 2 entry point.
        window.FS86EP = {
          engine,
          pads: padEls,
          get state() {
            return ep
              ? { index, track: track(), playing: isPlaying(), currentTime: audio.currentTime, duration: duration() }
              : null;
          },
        };
      })();
    </script>
  </body>
</html>
